<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrations | RJ Business Solutions</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="stylesheet" href="app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="integrations">
  <div class="app">
    <aside class="rail" id="rail"></aside>
    <section class="main">
      <header class="top">
        <h1>Integrations</h1>
        <div class="meta">
          <a class="org" href="settings.html">Workspace</a>
          <a class="avatar" href="settings.html">RJ</a>
        </div>
      </header>
      <div class="body">
        <div class="content">
          <div class="grid grid-3">
            <article class="card"><h3>X / Twitter</h3><p class="ok">Connected</p><button class="ghost" style="margin-top:12px" data-toast="X settings saved">Manage</button></article>
            <article class="card"><h3>LinkedIn</h3><p class="ok">Connected</p><button class="ghost" style="margin-top:12px" data-toast="LinkedIn settings saved">Manage</button></article>
            <article class="card"><h3>Instagram</h3><p class="ok">Connected</p><button class="ghost" style="margin-top:12px" data-toast="Instagram settings saved">Manage</button></article>
            <article class="card"><h3>Facebook</h3><p class="ok">Connected</p><button class="ghost" style="margin-top:12px" data-toast="Facebook settings saved">Manage</button></article>
            <article class="card"><h3>YouTube</h3><p class="ok">Connected</p><button class="ghost" style="margin-top:12px" data-toast="YouTube settings saved">Manage</button></article>
            <article class="card"><h3>TikTok</h3><p class="muted">Not connected</p><button class="add" style="margin-top:12px" data-toast="TikTok connect started">Connect</button></article>
            <article class="card"><h3>Pinterest</h3><p class="muted">Not connected</p><button class="add" style="margin-top:12px" data-toast="Pinterest connect started">Connect</button></article>
            <article class="card"><h3>Threads</h3><p class="muted">Not connected</p><button class="add" style="margin-top:12px" data-toast="Threads connect started">Connect</button></article>
            <article class="card"><h3>Slack</h3><p class="muted">Not connected</p><button class="add" style="margin-top:12px" data-toast="Slack connect started">Connect</button></article>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
  <script src="nav.js"></script>
</body>
</html>
