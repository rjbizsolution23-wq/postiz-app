<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | RJ Business Solutions</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="stylesheet" href="app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="auth-shell">
    <section class="auth-panel">
      <div class="auth-inner">
        <div class="brand">
          <img src="assets/logo.png" alt="RJ Business Solutions" />
          <div>
            <h2>RJ BUSINESS SOLUTIONS</h2>
            <p>EMPOWERING GENERATIONAL WEALTH</p>
          </div>
        </div>
        <h1 style="font-size:40px;font-weight:500;letter-spacing:-.8px;margin:8px 0 28px">Sign Up</h1>
        <a class="oauth" href="calendar.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Continue with Google</a>
        <div class="or"><span>or</span></div>
        <form action="calendar.html" method="get">
          <div class="field"><label>Company</label><input name="company" value="RJ Business Solutions" required /></div>
          <div class="field"><label>Email</label><input type="email" name="email" placeholder="Email Address" required /></div>
          <div class="field"><label>Password</label><input type="password" name="password" placeholder="Password" required /></div>
          <button class="btn" type="submit">Create account</button>
        </form>
        <div class="switch">Already have an account? <a href="index.html">Sign In</a></div>
      </div>
    </section>
    <aside class="hero">
      <div class="hero-copy">Start growing with<br /><span>RJ Business Solutions</span></div>
    </aside>
  </div>
</body>
</html>
